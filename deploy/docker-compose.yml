# M5 topology: 3 gateways (cluster rate limiting) + 3 mock backends + 2 mock LLM
# providers (provider-a, provider-b), Prometheus and Grafana.
# Gateways: localhost:8080-8082 (admin 9090-9092).
# Later milestones add control plane, more gateways, mockllm and observability.
name: tollgate

x-backend: &backend
  build: {context: .., args: {BIN: mockbackend}}
  image: tollgate/mockbackend:dev
  command: ["-addr", ":9000"]
  restart: "no"

services:
  gateway-1:
    build: {context: .., args: {BIN: tollgate-gw}}
    image: tollgate/tollgate-gw:dev
    command: ["-config", "/etc/tollgate/gateway.yaml", "-cluster-self", "gateway-1"]
    volumes:
      - ./gateway.yaml:/etc/tollgate/gateway.yaml:ro
      - ./rules.tg:/etc/tollgate/rules.tg:ro
    ports: ["8080:8080", "9090:9090"]
    depends_on: [backend-1, backend-2, backend-3, provider-a, provider-b]

  gateway-2:
    build: {context: .., args: {BIN: tollgate-gw}}
    image: tollgate/tollgate-gw:dev
    command: ["-config", "/etc/tollgate/gateway.yaml", "-cluster-self", "gateway-2"]
    volumes:
      - ./gateway.yaml:/etc/tollgate/gateway.yaml:ro
      - ./rules.tg:/etc/tollgate/rules.tg:ro
    ports: ["8081:8080", "9091:9090"]
    depends_on: [backend-1, backend-2, backend-3, provider-a, provider-b]

  gateway-3:
    build: {context: .., args: {BIN: tollgate-gw}}
    image: tollgate/tollgate-gw:dev
    command: ["-config", "/etc/tollgate/gateway.yaml", "-cluster-self", "gateway-3"]
    volumes:
      - ./gateway.yaml:/etc/tollgate/gateway.yaml:ro
      - ./rules.tg:/etc/tollgate/rules.tg:ro
    ports: ["8082:8080", "9092:9090"]
    depends_on: [backend-1, backend-2, backend-3, provider-a, provider-b]

  backend-1:
    <<: *backend
    command: ["-addr", ":9000", "-name", "backend-1"]
  backend-2:
    <<: *backend
    command: ["-addr", ":9000", "-name", "backend-2"]
  backend-3:
    <<: *backend
    command: ["-addr", ":9000", "-name", "backend-3"]

  provider-a:
    build: {context: .., args: {BIN: mockllm}}
    image: tollgate/mockllm:dev
    command: ["-addr", ":9200", "-name", "provider-a", "-ttft-median", "300ms", "-tail-prob", "0.05", "-tail-mult", "8",
              "-inject", "secret code,home address", "-inject-prob", "0.1"]
  provider-b:
    image: tollgate/mockllm:dev
    command: ["-addr", ":9200", "-name", "provider-b", "-ttft-median", "350ms", "-tail-prob", "0.05", "-tail-mult", "8", "-seed", "2"]
    depends_on: [provider-a]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9095:9090"]
    depends_on: [gateway-1, gateway-2, gateway-3]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
