# M2 topology: 1 gateway + 3 mock backends, Prometheus and Grafana.
# Later milestones add control plane, more gateways, mockllm and observability.
name: tollgate

x-backend: &backend
  build: {context: .., args: {BIN: mockbackend}}
  image: tollgate/mockbackend:dev
  command: ["-addr", ":9000"]
  restart: "no"

services:
  gateway:
    build: {context: .., args: {BIN: tollgate-gw}}
    image: tollgate/tollgate-gw:dev
    command: ["-config", "/etc/tollgate/gateway.yaml", "-node", "gw-1"]
    volumes:
      - ./gateway.yaml:/etc/tollgate/gateway.yaml:ro
      - ./rules.tg:/etc/tollgate/rules.tg:ro
    ports: ["8080:8080", "9090:9090"]
    depends_on: [backend-1, backend-2, backend-3]

  backend-1:
    <<: *backend
    command: ["-addr", ":9000", "-name", "backend-1"]
  backend-2:
    <<: *backend
    command: ["-addr", ":9000", "-name", "backend-2"]
  backend-3:
    <<: *backend
    command: ["-addr", ":9000", "-name", "backend-3"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9091:9090"]
    depends_on: [gateway]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
