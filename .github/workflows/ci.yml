name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: test (race, coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage report
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo '### Coverage'
            echo '```'
            grep -E '^total:' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: build binaries
        run: make build

  fuzz:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz smoke (30s per target)
        run: make fuzz-smoke FUZZ_TIME=30s

  images:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        bin: [tollgate-gw, mockbackend]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --build-arg BIN=${{ matrix.bin }} -t tollgate/${{ matrix.bin }}:ci .
