name: bench

# Runs the experiments on clean GitHub-hosted Linux runners (one fresh VM
# per experiment) and uploads the result files. Results are labelled
# mode=ci-runner and reported separately from laptop numbers.
on:
  workflow_dispatch:
    inputs:
      experiments:
        description: "space-separated: e1 e2 e3 e4 e5 e6 e7 e8 e9 e10 e11 sim"
        default: "e1 e2 e3 e4 e5 e6 e7 e8 e9 e10 e11 sim"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: echo "matrix=$(echo '${{ inputs.experiments }}' | jq -Rc 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        exp: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install k6 v2.4.0
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v2.4.0/k6-v2.4.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v2.4.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: run ${{ matrix.exp }}
        run: |
          ulimit -n 65536 || true
          go run ./bench/run -mode ci-runner -out ci-results ${{ matrix.exp }}
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.exp }}
          path: ci-results/*.json
